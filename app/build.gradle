plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseSigningPropertiesFile = rootProject.file('signing/k9.release.signing.properties')
def releaseKeystoreFile = rootProject.file('signing/debug.keystore')
def releaseSigningProperties = new Properties()
def hasReleaseSigning = releaseSigningPropertiesFile.exists() && releaseKeystoreFile.exists()
if (hasReleaseSigning) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}

android {
    namespace 'com.huanglong.pad'
    compileSdk 33

    defaultConfig {
        applicationId "com.huanglong.pad"
        minSdk 26
        targetSdk 33
        versionCode 3
        versionName "1.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseKeystoreFile
                storePassword releaseSigningProperties['k9.release.storePassword']
                keyAlias releaseSigningProperties['k9.release.keyAlias']
                keyPassword releaseSigningProperties['k9.release.keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

tasks.configureEach { task ->
    if (!hasReleaseSigning && task.name in ['assembleRelease', 'bundleRelease', 'packageRelease']) {
        task.doFirst {
            throw new GradleException('Release signing files are missing from signing/.')
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
